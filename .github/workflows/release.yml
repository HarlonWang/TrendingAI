name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # 匹配 1.0.0, 1.2.3-alpha 等格式
  workflow_dispatch: # 仅跑 build-ios 验证构建链路：不创建/不触碰 Release，产物走 workflow artifact

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # App 内置更新说明文件，同时被「Generate What's New Changelog」和「Generate Release Notes」引用
      WHATSNEW_PATH: shared/src/commonMain/composeResources/files/whatsnew.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Publish to Google Play 步骤要 gem install fastlane；系统 Ruby 装 gem 需 sudo，用工具链 Ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Prepare Version Info
        run: |
          # 仅传 tag 名；versionCode 由 build.gradle.kts 从 tag 推导（apk/play/fdroid 三渠道统一）
          echo "VERSION_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          # 从 Secrets 读取 Base64 并还原为文件
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.jks" >> $GITHUB_ENV

      # 构建前生成面向用户的双语 changelog，覆盖仓库里的占位文件后随 APK 打包，
      # App 升级后首启据此弹「新版本更新说明」。生成失败不阻塞发布（保留占位文件 = 该版本不弹窗）。
      #
      # 「自动 / 手动」开关（内容驱动，无额外配置）：
      #   - 仓库里 whatsnew.json 的 version 恰等于本次 tag 且 zh/en 至少一个非空
      #     → 手动模式：直接采用本地已写好的内容，跳过 AI。
      #   - 否则 → 自动模式：调 AI 用 commit 记录生成并覆盖。
      #     （若检测到本地有内容但 version 与 tag 不符，会打警告后仍由 AI 覆盖，避免误发。）
      - name: Generate What's New Changelog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 获取 commit 记录（同时供后面 Release Notes 步骤复用）
          # 正则尾部的 $ 是关键：只取正式版 tag 作基准，预发布（-beta.N 等）一律排除。
          # 灰度期发 0.22.0-beta.2 时基准仍是 0.21.0，与手写 whatsnew 的「相对上个正式版累计」
          # 口径一致；转正时也不会把自家 beta 当基准。此前靠 grep -v 非锚定匹配连带过滤同号
          # beta（0.22.0 恰是 0.22.0-beta.3 的子串）纯属巧合，版本号一旦与 beta 不同名即失效。
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${{ github.ref_name }}$" | head -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_LOGS=$(git log "$PREVIOUS_TAG"..HEAD --no-merges --oneline)
          else
            COMMIT_LOGS=$(git log --no-merges --oneline -n 20)
          fi
          echo "$COMMIT_LOGS" > commit_logs.txt

          python3 - <<'EOF'
          import os
          import json
          import urllib.request

          version = os.environ.get("VERSION_NAME", "")
          target = os.environ["WHATSNEW_PATH"]

          with open("commit_logs.txt", "r") as f:
              commits = f.read().strip()

          # 开关判定：仓库里已有「本版」人工内容则直接采用，跳过 AI
          existing = {}
          try:
              with open(target, "r") as f:
                  existing = json.load(f)
          except Exception as e:
              print(f"⚠️ Failed to read existing whatsnew.json: {e}")
          existing_zh = [x for x in existing.get("zh", []) if isinstance(x, str) and x.strip()]
          existing_en = [x for x in existing.get("en", []) if isinstance(x, str) and x.strip()]
          has_content = bool(existing_zh or existing_en)
          if version and existing.get("version") == version and has_content:
              print(f"✅ 使用本地提供的更新说明，跳过 AI: zh={len(existing_zh)} en={len(existing_en)}")
              exit(0)
          if has_content and existing.get("version") != version:
              print(f"⚠️ 检测到本地 whatsnew.json 有内容但版本({existing.get('version')})与本次 tag({version})不符，将由 AI 覆盖生成")

          api_key = os.environ.get("OPENAI_API_KEY", "")
          if not commits or not api_key or not version:
              print("⚠️ Missing commits / OPENAI_API_KEY / VERSION_NAME, keep placeholder whatsnew.json")
              exit(0)

          prompt = (
              "请根据以下 git commit 记录，为移动 App 生成面向普通用户的版本更新说明。\n"
              "要求：\n"
              "1. 过滤纯内部改动（构建、CI、打包、签名、依赖升级、重构、测试、文档），以及用户无直接感知的能力（统计、埋点、渠道识别、版本分发、监控、日志），只保留用户可感知的新功能、优化和修复。\n"
              "2. 每条一句话，简洁明了，不要堆砌技术术语；中文 3-6 条，英文为对应翻译。\n"
              "3. 严格输出 JSON 对象：{\"zh\": [\"...\"], \"en\": [\"...\"]}，不要输出任何其他内容。\n\n"
              f"Commits:\n{commits}"
          )

          data = {
              "model": "gpt-5.4",
              "messages": [{"role": "user", "content": prompt}],
              "response_format": {"type": "json_object"},
              "temperature": 0.7
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              }
          )

          try:
              print("Calling ChatGPT API for whatsnew.json (model: gpt-5.4)...")
              with urllib.request.urlopen(req, timeout=60) as response:
                  res_data = json.loads(response.read().decode("utf-8"))
                  content = json.loads(res_data["choices"][0]["message"]["content"])
                  zh = [x.strip() for x in content.get("zh", []) if isinstance(x, str) and x.strip()]
                  en = [x.strip() for x in content.get("en", []) if isinstance(x, str) and x.strip()]
                  if not zh and not en:
                      print("⚠️ Empty changelog from model, keep placeholder")
                      exit(0)
                  # version 以 CI 环境变量为准，不信任模型输出
                  with open(target, "w") as f:
                      json.dump({"version": version, "zh": zh, "en": en}, f, ensure_ascii=False, indent=2)
                  print(f"✅ whatsnew.json generated: zh={len(zh)} en={len(en)}")
          except Exception as e:
              print(f"⚠️ whatsnew.json generation failed, keep placeholder: {e}")
          EOF

      - name: Build Release APK & AAB
        run: |
          # fdroid flavor 不在 CI 构建：F-Droid buildserver 从 tag 源码自建（fdroiddata 元数据
          # gradle: fdroid），release assets 不需要它；Obtainium 抓 github 渠道 APK
          ./gradlew :androidApp:assembleGithubRelease :androidApp:assembleR2Release :androidApp:bundlePlayRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 复用上面生成的 whatsnew.json 拼装 Release Notes，保证 GitHub Release 与 App 内
      # 更新说明内容一致；生成失败时退回原始 commit 记录。
      - name: Generate Release Notes
        run: |
          python3 - <<'EOF'
          import json
          import os

          version = os.environ.get("VERSION_NAME", "")

          commits = ""
          if os.path.exists("commit_logs.txt"):
              with open("commit_logs.txt", "r") as f:
                  commits = f.read().strip()

          whatsnew = {}
          try:
              with open(os.environ["WHATSNEW_PATH"], "r") as f:
                  whatsnew = json.load(f)
          except Exception as e:
              print(f"⚠️ Failed to read whatsnew.json: {e}")

          lines = []
          if whatsnew.get("version") == version and (whatsnew.get("zh") or whatsnew.get("en")):
              if whatsnew.get("zh"):
                  lines.append("### ✨ 更新内容")
                  lines += [f"- {x}" for x in whatsnew["zh"]]
                  lines.append("")
              if whatsnew.get("en"):
                  lines.append("### ✨ What's New")
                  lines += [f"- {x}" for x in whatsnew["en"]]
                  lines.append("")
              print("✅ Release notes assembled from whatsnew.json")
          elif commits:
              lines.append("### 变更记录 (Changelog)")
              lines.append("")
              lines.append(commits)
              lines.append("")
              print("⚠️ whatsnew.json unavailable, fallback to raw commit logs")
          else:
              lines.append("* No specific changes.")
              lines.append("")

          with open("release_summary.md", "w") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Prepare APK Diff
        id: diffuse
        run: |
          # 1. 下载并解压固定版本 diffuse 0.3.0
          gh release download 0.3.0 --repo JakeWharton/diffuse --pattern "diffuse-0.3.0.zip" --output diffuse.zip
          unzip -q diffuse.zip
          chmod +x diffuse-0.3.0/bin/diffuse

          # 2. 获取上一个 Tag（同上：$ 锚定，只拿正式版作 diff 基准。预发布 Release 未必带
          #    APK 资产，拿它当基准既下载不到、diff 出来也只反映 beta 间的增量而非整版变化）
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${{ github.ref_name }}$" | head -n 1)
          
          NEW_APK=$(find androidApp/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          
          echo "### Apk Diff" >> release_summary.md
          
          if [ -n "$PREVIOUS_TAG" ]; then
            # 3. 下载旧版本 APK
            mkdir -p old-apk
            if gh release download "$PREVIOUS_TAG" -p "*.apk" --dir old-apk; then
              OLD_APK=$(find old-apk -name "*.apk" | head -n 1)
              
              if [ -n "$OLD_APK" ]; then
                # 4. 运行对比并生成摘要
                ./diffuse-0.3.0/bin/diffuse diff "$OLD_APK" "$NEW_APK" > diff-apk.txt
                echo '```text' >> release_summary.md
                sed -n '/^=================/q;p' diff-apk.txt >> release_summary.md
                echo '```' >> release_summary.md
              else
                echo "⚠️ 未能在上一个 Release ($PREVIOUS_TAG) 中找到 APK 文件。" >> release_summary.md
              fi
            else
              echo "⚠️ 无法下载上一个 Release ($PREVIOUS_TAG) 的产物。" >> release_summary.md
            fi
          else
            echo "🆕 首次发布，无历史版本对比。" >> release_summary.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare Dependencies
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | grep -v "${{ github.ref_name }}" | head -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            git show "$PREVIOUS_TAG:gradle/libs.versions.toml" > old_libs.toml || touch old_libs.toml
            python3 - <<EOF > dep_diff.md
          import sys
          import tomllib
          def load_versions(path):
              try:
                  with open(path, "rb") as f:
                      return tomllib.load(f).get("versions", {})
              except: return {}

          old_v = load_versions("old_libs.toml")
          new_v = load_versions("gradle/libs.versions.toml")
          
          all_keys = sorted(set(old_v.keys()) | set(new_v.keys()))
          changes = []
          for k in all_keys:
              old_val = old_v.get(k)
              new_val = new_v.get(k)
              if old_val != new_val:
                  changes.append((k, old_val if old_val else "None", new_val if new_val else "Removed"))

          if changes:
              print("### Dependency Update\n")
              print("| Dependency | Previous version | New version |")
              print("| :--- | :--- | :--- |")
              for name, old, new in changes:
                  print(f"| {name} | {old} | {new} |")
              print("\n")
          EOF
            if [ -s dep_diff.md ]; then
              # 将依赖变更追加到 release_summary.md 的末尾
              cat dep_diff.md >> release_summary.md
            fi
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_PRERELEASE=""
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          
          # 生成 version_code.txt 供 F-Droid HTTP UpdateCheck 读取最新版本号（纯文本、无引号，
          # 规避 JSON 双引号在 fdroid rewritemeta 折叠长 UpdateCheckData 时的格式问题；格式参考 LibChecker）
          # versionCode/versionName 直接从构建产物 APK 读取（aapt dump badging），公式只在
          # build.gradle.kts 一处维护，且保证 version_code.txt 描述的就是实际发布的 APK
          APK_FOR_VERSION=$(find androidApp/build/outputs/apk/github/release -name "*.apk" | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)
          BADGING=$("$AAPT" dump badging "$APK_FOR_VERSION" | grep '^package:')
          # 字段名前锚定空格，避免误匹配同行的 platformBuildVersionCode/Name
          VCODE=$(sed -n "s/.* versionCode='\([0-9]\{1,\}\)'.*/\1/p" <<< "$BADGING")
          VNAME=$(sed -n "s/.* versionName='\([^']\{1,\}\)'.*/\1/p" <<< "$BADGING")
          if [ -z "$VCODE" ] || [ -z "$VNAME" ]; then
            echo "❌ 无法从 APK 读取 versionCode/versionName: $BADGING"
            exit 1
          fi
          printf 'versionCode=%d\nversionName=%s\n' "$VCODE" "$VNAME" > version_code.txt
          cat version_code.txt

          # 收集待上传的文件（github 渠道 APK + play 渠道 AAB + version_code.txt）
          # assets 只放一个 APK，Obtainium 单 APK 时自动选中、不弹多选对话框
          FILES=(androidApp/build/outputs/apk/github/release/*.apk version_code.txt)
          for aab in androidApp/build/outputs/bundle/playRelease/*.aab; do
            [ -f "$aab" ] && FILES+=("$aab")
          done
          if [ -s diff-apk.txt ]; then
            FILES+=("diff-apk.txt")
          fi

          # whatsnew.json 上传为 release asset，供 app 更新弹窗展示更新内容（androidLibrary/updater
          # 按固定文件名 whatsnew.json 查找并消费）。仅在 version==本次 tag 且内容非空时上传；
          # 占位文件 / 生成失败则跳过，客户端找不到 asset 会回退为不带内容的更新弹窗。
          if python3 - <<'EOF'
          import json, os, sys
          try:
              with open(os.environ["WHATSNEW_PATH"]) as f:
                  d = json.load(f)
          except Exception:
              sys.exit(1)
          def items(key):
              return [x for x in d.get(key, []) if isinstance(x, str) and x.strip()]
          version = os.environ.get("VERSION_NAME", "")
          ok = bool(version) and d.get("version") == version and (items("zh") or items("en"))
          sys.exit(0 if ok else 1)
          EOF
          then
            echo "✅ whatsnew.json 内容有效，随 Release 上传"
            FILES+=("$WHATSNEW_PATH")
          else
            echo "⚠️ whatsnew.json 无本版有效内容，跳过上传"
          fi

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_summary.md \
            --generate-notes \
            $IS_PRERELEASE \
            "${FILES[@]}"

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          # 预发布（alpha/beta/rc，判定与 Create Release 步骤一致）不上传 R2：
          # 官网下载入口指向 TrendingAI-latest.apk，灰度包不能覆盖它，
          # 灰度分发走 GitHub Release 的 prerelease 附件链接
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            echo "⏭️ Prerelease tag，跳过 R2 上传"
            exit 0
          fi

          # 动态寻找刚才打包好的 r2 渠道 APK 路径（官网/R2 分发的就是 r2 包）
          APK_PATH=$(find androidApp/build/outputs/apk/r2/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          echo "Uploading to R2..."

          # 执行上传操作，固定命名为 TrendingAI-latest.apk，覆盖上一版本
          # 请确保 s3:// 后面跟着的是你在 R2 创建的真实 Bucket 名称
          aws s3 cp "$APK_PATH" s3://trendingai-apk/TrendingAI-latest.apk \
            --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com"

          echo "✅ Upload completed. Download link: https://download.trendingai.cn/TrendingAI-latest.apk"

      # 发布到 Google Play 正式轨道：上传 play 渠道 AAB + 发版说明，上传即送审、过审自动上线。
      # 商品详情（文案/截图）不在这里同步——那是 play_listing.yml 的职责（fastlane/metadata
      # 变更 push 到 main 时触发），发版与商店物料两个生命周期各走各的。
      # 发版说明优先用仓库 changelogs/<versionCode>.txt（手动模式发版流程已写入并随 tag 提交）；
      # 缺失时（自动模式）从 whatsnew.json 就地生成，只喂 supply、不回写仓库。
      # 密钥经 SUPPLY_JSON_KEY_DATA 环境变量传入（fastlane 原生识别），不落盘。
      - name: Publish to Google Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # 预发布不上 Play（判定与 R2 步骤一致）：灰度走 GitHub Release 附件
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            echo "⏭️ Prerelease tag，跳过 Play 发布"
            exit 0
          fi

          # versionCode 复用 Create Release 步骤从 APK badging 提取的结果（version_code.txt）
          VCODE=$(sed -n 's/^versionCode=//p' version_code.txt)
          if [ -z "$VCODE" ]; then
            echo "❌ version_code.txt 中未找到 versionCode"
            exit 1
          fi

          # changelog 兜底：仓库没有本版 changelog 文件时，从 whatsnew.json 生成。
          # Play 发版说明单语言上限 500 字符，逐条累加、放不下的整条丢弃（不截半句）。
          python3 - "$VCODE" <<'EOF'
          import json, os, sys

          vcode = sys.argv[1]
          try:
              with open(os.environ["WHATSNEW_PATH"]) as f:
                  whatsnew = json.load(f)
          except Exception:
              whatsnew = {}

          for key, loc in (("zh", "zh-CN"), ("en", "en-US")):
              path = f"fastlane/metadata/android/{loc}/changelogs/{vcode}.txt"
              if os.path.exists(path):
                  print(f"✅ 已有 {path}，沿用仓库版本")
                  continue
              items = [x.strip() for x in whatsnew.get(key, []) if isinstance(x, str) and x.strip()]
              if not items:
                  print(f"⚠️ whatsnew.json 无 {key} 内容，{loc} 发版说明留空")
                  continue
              text = ""
              for item in items:
                  line = f"• {item}\n"
                  if len(text) + len(line) > 500:
                      break
                  text += line
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f:
                  f.write(text.rstrip("\n"))
              print(f"✅ 生成 {path}（{len(text)} 字符）")
          EOF

          AAB_PATH=$(find androidApp/build/outputs/bundle/playRelease -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "❌ 未找到 play 渠道 AAB"
            exit 1
          fi

          gem install fastlane --no-document
          # 不跳过 changelogs：随本次 versionCode 一起作为发版说明上传
          fastlane supply --package_name whl.trending.ai \
            --aab "$AAB_PATH" \
            --track production \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true

  # iOS 无签名 IPA：挂到 Release 供用户用免费 Apple ID 自签侧载（Sideloadly / AltStore）。
  # shared framework 是静态链接（isStatic），.app 内无需嵌入签名的动态库，无签名构建可直接分发。
  build-ios:
    # tag push 时等 Android job 建好 Release 再上传附件；workflow_dispatch 单独验证 iOS 构建
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build-and-release.result == 'success') }}
    needs: build-and-release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Kotlin/Native 编译器与平台库约 1GB，不缓存每次冷下载十分钟起
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Build unsigned IPA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # versionCode 从 Create Release 步骤上传的 version_code.txt 取
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION_NAME="${{ github.ref_name }}"
            VCODE=$(gh release download "$VERSION_NAME" -p version_code.txt -O - | sed -n 's/^versionCode=//p')
            if [ -z "$VCODE" ]; then
              echo "❌ 未能从 Release 资产 version_code.txt 读到 versionCode"
              exit 1
            fi
          else
            VERSION_NAME="0.0.0"
            VCODE=0
          fi
          # CFBundleShortVersionString 按 Apple 约定为纯 x.y.z，预发布后缀只进 IPA 文件名
          BASE_VERSION="${VERSION_NAME%%-*}"

          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$BASE_VERSION" CURRENT_PROJECT_VERSION="$VCODE" \
            build

          APP_DIR="$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos"
          IPA_NAME="TrendingAI-${VERSION_NAME}.ipa"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 构建产物目录中未找到 .app"
            exit 1
          fi
          mkdir "$APP_DIR/Payload"
          cp -R "$APP_PATH" "$APP_DIR/Payload/"
          (cd "$APP_DIR" && zip -qr "$IPA_NAME" Payload)
          mv "$APP_DIR/$IPA_NAME" .
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload IPA to Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$IPA_NAME" "$IPA_NAME.sha256"

      - name: Upload IPA as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            TrendingAI-*.ipa
            TrendingAI-*.ipa.sha256

