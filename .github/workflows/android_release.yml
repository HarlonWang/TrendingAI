name: Android Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # 匹配 1.0.0, 1.2.3-alpha 等格式

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Version Info
        run: |
          # 直接使用 tag 名称 (例如 1.0.0)
          echo "VERSION_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          # 从 Secrets 读取 Base64 并还原为文件
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.jks" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleApkRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Generate Release Notes
        run: |
          # 获取 commit 记录
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | grep -v "${{ github.ref_name }}" | head -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_LOGS=$(git log "$PREVIOUS_TAG"..HEAD --no-merges --oneline)
          else
            COMMIT_LOGS=$(git log --no-merges --oneline -n 20)
          fi
          
          # 修复变量传递问题：直接将变量内容存入临时文件，供 Python 读取
          echo "$COMMIT_LOGS" > commit_logs.txt
          
          python3 - <<'EOF'
          import os
          import json
          import urllib.request
          
          # 从临时文件读取 commit 记录
          if os.path.exists("commit_logs.txt"):
              with open("commit_logs.txt", "r") as f:
                  commits = f.read().strip()
          else:
              commits = ""
              
          api_key = os.environ.get("OPENAI_API_KEY", "")
          api_url = "https://api.openai.com/v1/chat/completions"
          
          fallback_text = "### 变更记录 (Changelog)\n\n" + commits
          
          if not commits:
              with open("release_summary.md", "w") as f:
                  f.write("* No specific changes.\n\n")
              exit(0)
              
          if not api_key:
              print("⚠️ OPENAI_API_KEY not found. Using fallback.")
              with open("release_summary.md", "w") as f:
                  f.write(fallback_text + "\n\n")
              exit(0)
              
          prompt = f"请根据以下 git commit 记录，生成一份面向用户的 Release Notes。\n要求：\n1. 忽略琐碎的构建或内部调整，总结出核心的新特性、优化和修复。\n2. 同时提供清晰的中文和英文版本（中文在上，英文在下）。\n3. 使用 Markdown 列表格式，不要输出过于啰碎的技术术语。\n\nCommits:\n{commits}"
          
          data = {
              "model": "gpt-5.1",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.7
          }
          
          req = urllib.request.Request(api_url, data=json.dumps(data).encode("utf-8"), headers={
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}"
          })
          
          try:
              print("Calling ChatGPT API (model: gpt-5.1)...")
              with urllib.request.urlopen(req, timeout=30) as response:
                  res_data = json.loads(response.read().decode("utf-8"))
                  summary = res_data["choices"][0]["message"]["content"]
                  with open("release_summary.md", "w") as f:
                      f.write(summary + "\n\n")
                  print("✅ ChatGPT generated release notes successfully.")
          except Exception as e:
              print(f"⚠️ ChatGPT API call failed: {e}")
              with open("release_summary.md", "w") as f:
                  f.write(fallback_text + "\n\n")
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Prepare APK Diff
        id: diffuse
        run: |
          # 1. 下载并解压固定版本 diffuse 0.3.0
          gh release download 0.3.0 --repo JakeWharton/diffuse --pattern "diffuse-0.3.0.zip" --output diffuse.zip
          unzip -q diffuse.zip
          chmod +x diffuse-0.3.0/bin/diffuse

          # 2. 获取上一个 Tag
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | grep -v "${{ github.ref_name }}" | head -n 1)
          
          NEW_APK=$(find androidApp/build/outputs/apk/apk/release -name "*.apk" | head -n 1)
          
          echo "### Apk Diff" >> release_summary.md
          
          if [ -n "$PREVIOUS_TAG" ]; then
            # 3. 下载旧版本 APK
            mkdir -p old-apk
            if gh release download "$PREVIOUS_TAG" -p "*.apk" --dir old-apk; then
              OLD_APK=$(find old-apk -name "*.apk" | head -n 1)
              
              if [ -n "$OLD_APK" ]; then
                # 4. 运行对比并生成摘要
                ./diffuse-0.3.0/bin/diffuse diff "$OLD_APK" "$NEW_APK" > diff-apk.txt
                echo '```text' >> release_summary.md
                sed -n '/^=================/q;p' diff-apk.txt >> release_summary.md
                echo '```' >> release_summary.md
              else
                echo "⚠️ 未能在上一个 Release ($PREVIOUS_TAG) 中找到 APK 文件。" >> release_summary.md
              fi
            else
              echo "⚠️ 无法下载上一个 Release ($PREVIOUS_TAG) 的产物。" >> release_summary.md
            fi
          else
            echo "🆕 首次发布，无历史版本对比。" >> release_summary.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare Dependencies
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | grep -v "${{ github.ref_name }}" | head -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            git show "$PREVIOUS_TAG:gradle/libs.versions.toml" > old_libs.toml || touch old_libs.toml
            python3 - <<EOF > dep_diff.md
          import sys
          import tomllib
          def load_versions(path):
              try:
                  with open(path, "rb") as f:
                      return tomllib.load(f).get("versions", {})
              except: return {}

          old_v = load_versions("old_libs.toml")
          new_v = load_versions("gradle/libs.versions.toml")
          
          all_keys = sorted(set(old_v.keys()) | set(new_v.keys()))
          changes = []
          for k in all_keys:
              old_val = old_v.get(k)
              new_val = new_v.get(k)
              if old_val != new_val:
                  changes.append((k, old_val if old_val else "None", new_val if new_val else "Removed"))

          if changes:
              print("### Dependency Update\n")
              print("| Dependency | Previous version | New version |")
              print("| :--- | :--- | :--- |")
              for name, old, new in changes:
                  print(f"| {name} | {old} | {new} |")
              print("\n")
          EOF
            if [ -s dep_diff.md ]; then
              # 将依赖变更追加到 release_summary.md 的末尾
              cat dep_diff.md >> release_summary.md
            fi
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_PRERELEASE=""
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          
          # 收集待上传的文件
          FILES=(androidApp/build/outputs/apk/apk/release/*.apk)
          if [ -s diff-apk.txt ]; then
            FILES+=("diff-apk.txt")
          fi
          
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_summary.md \
            --generate-notes \
            $IS_PRERELEASE \
            "${FILES[@]}"

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          # 动态寻找刚才打包好的 APK 路径 
          APK_PATH=$(find androidApp/build/outputs/apk/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          echo "Uploading to R2..."
          
          # 执行上传操作，固定命名为 TrendingAI-latest.apk，覆盖上一版本
          # 请确保 s3:// 后面跟着的是你在 R2 创建的真实 Bucket 名称
          aws s3 cp "$APK_PATH" s3://trendingai-apk/TrendingAI-latest.apk \
            --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com"
          
          echo "✅ Upload completed. Download link: https://download.trendingai.cn/TrendingAI-latest.apk"
